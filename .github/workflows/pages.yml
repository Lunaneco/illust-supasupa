name: Check Pages build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE: "/"
        run: npm run build
